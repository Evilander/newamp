name: CI

# Typecheck + build + the CI-safe (pure-node, no display, no audio hardware)
# smokes on every push and PR. The display- and audio-dependent smokes and the
# Windows/macOS signing readiness smokes are NOT run here — they live in the
# release workflow's per-OS legs (see release.yml) and in the local release
# gate. See docs/ci.md for the full classification.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile + load health for the Bit-Perfect Exclusive addon on macOS
  # (CoreAudio hog-mode section). Minimal on purpose: no repo npm ci, just the
  # addon's own toolchain. Real-hardware verification is a separate, manual
  # concern — this proves the code builds and the N-API surface loads.
  native-macos:
    name: "Native addon · macOS compile + load"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build addon
        working-directory: native/newamp-audio
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx node-gyp rebuild
      - name: Load + enumerate
        run: |
          node -e "const a=require('./native/newamp-audio/build/Release/newamp_audio.node'); const d=a.listDevices(); console.log('mac load OK, devices:', d.length, d.map(x=>x.name).join(', '))"

  verify:
    name: Typecheck · Build · Smokes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (renderer + electron)
        run: npm run typecheck

      - name: Build (vite renderer + electron main)
        run: npm run build

      - name: Native addon — build + load (Bit-Perfect Exclusive, ALSA lane)
        # Compiles native/newamp-audio for linux-x64, loads it, and enumerates
        # devices (zero on this headless runner — the assertion is that the
        # cross-platform build lane and N-API surface stay healthy).
        run: npm run build:native -- --force

      - name: "Smoke — exclusive output addon (headless build+load+enumerate)"
        run: npm run smoke:exclusive-output

      - name: Smoke — build lock
        run: npm run smoke:build-lock

      - name: Smoke — library (scan + query)
        run: npm run smoke:library

      - name: Smoke — Wrapped stats (day/week/month/year/all) + wiring
        run: npm run smoke:wrapped

      - name: Smoke — social objects (reviews/lists/profile + export)
        run: npm run smoke:social

      - name: Smoke — visualizer module exports
        run: npm run smoke:visualizer

      - name: Test — Eviland audio reactor (structure detection)
        run: npm run test:eviland-audio

      - name: Test — Eviland Director (timer rotation + drift + recall + plan round-trip)
        run: npm run test:eviland-director

      - name: Test — Eviland visual-memory schema + helpers
        run: npm run test:eviland-memory

      - name: Test — Eviland visual-memory bridge (loader + lineage + flush)
        run: npm run test:eviland-memory-bridge

      - name: Test — Eviland fluid forces + operator channels
        run: |
          npm run test:eviland-fluid
          npm run test:eviland-operators

      - name: Test — algoVersion guard (randomizer/director changes bump VISUAL_MEMORY_ALGO_VERSION)
        run: npm run test:algo-version-guard

      - name: Test — macOS logic (device-change, music-folders, cache-key, app-menu, macho-arch)
        run: |
          npm run test:device-change
          npm run test:music-folders
          npm run test:cache-key-casing
          npm run test:app-menu
          npm run test:macho-arch

      - name: Test — virtualization window math
        run: |
          npm run test:virtual-rows
          npm run test:css-color

      - name: Test — library query perf (N+1 ordering + health cache)
        run: npm run test:library-query

      - name: Test — transcode cache probe (stream-first first play)
        run: npm run test:transcode-peek

      - name: Test — security (audio path allowlist + podcast host guard + tag-rule regex matcher)
        run: |
          npm run test:audio-path-policy
          npm run test:podcast-host-guard
          npm run test:safe-regex
          npm run test:tag-dsl-hardening

      - name: Smoke — renderer CSP (no unsafe-eval; eval scoped to iframe)
        run: npm run smoke:security

      - name: Smoke — visualizer capture/share wiring
        run: npm run smoke:viz-capture

      - name: Smoke — build provenance
        run: npm run smoke:build-provenance

      - name: Smoke — release secret hygiene
        run: npm run smoke:release-secrets

      - name: Smoke — reliability (DB corruption recovery)
        run: npm run smoke:reliability

      - name: Smoke — completion audit
        run: npm run smoke:completion-audit
