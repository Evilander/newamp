<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The main renderer runs with NO 'unsafe-eval'. Butterchurn/Milkdrop is
         the only code that needs eval (butterchurn-presets compiles preset math
         via the Function constructor); it is isolated in butterchurn-iframe.html,
         a same-origin frame whose own CSP scopes 'unsafe-eval' to just that
         frame. frame-src falls back to default-src 'self', which permits it. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: file: https: newart: newplaylistart:; media-src 'self' blob: file: https: newamp:; connect-src 'self' https: newamp: newart: newplaylistart: http://localhost:5173 ws://localhost:5173; object-src 'none'; base-uri 'self'" />
    <title>NewAmp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-amp-bg text-amp-ink antialiased font-display select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
